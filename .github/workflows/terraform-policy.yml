name: Terraform Policy as Code

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Enforce NorthStar Security Policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enforce custom Terraform policies
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            openpolicyagent/conftest:v0.64.0 \
            test --policy /project/policy /project/terraform
