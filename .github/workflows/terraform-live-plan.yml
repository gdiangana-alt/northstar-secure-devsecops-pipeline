name: NorthStar Live Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform-plan:
    name: Live Azure Plan — Read Only
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Azure through OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Initialize remote state
        run: terraform init -input=false

      - name: Generate live Terraform plan
        shell: bash
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            > "$RUNNER_TEMP/terraform-plan-full.txt" 2>&1
          PLAN_EXIT_CODE=$?
          set -e

          {
            echo "NorthStar Live Terraform Plan"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo

            if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
              echo "Result: No infrastructure changes detected."
            elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then
              echo "Result: Infrastructure changes detected."
              grep -E '^Plan:' "$RUNNER_TEMP/terraform-plan-full.txt" ||
                echo "Terraform reported changes without a count summary."
            else
              echo "Result: Terraform plan failed."
            fi
          } > "$RUNNER_TEMP/terraform-plan-summary.txt"

          if [ "$PLAN_EXIT_CODE" -eq 1 ]; then
            cat "$RUNNER_TEMP/terraform-plan-full.txt" >&2
            exit 1
          fi

      - name: Upload sanitized plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-live-plan-summary
          path: ${{ runner.temp }}/terraform-plan-summary.txt
          retention-days: 30
          if-no-files-found: error
